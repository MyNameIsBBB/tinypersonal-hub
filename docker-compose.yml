services:
  searxng:
    image: searxng/searxng:2026.7.31-057a77168
    container_name: tinypersonal-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-tinypersonal-local-searxng-change-me}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - tinypersonal-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tinypersonal-hub:local
    container_name: tinypersonal-hub
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/dev.db
      CODEX_WORKER_SOCKET: /run/codex-worker/worker.sock
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SEARXNG_BASE_URL: http://searxng:8080
    ports:
      - "3000:3000"
    volumes:
      - tinypersonal-hub-data:/data
      - ${CODEX_WORKER_DIR:-/tmp/tinypersonal-codex-worker}:/run/codex-worker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tinypersonal-network

volumes:
  tinypersonal-hub-data:
    name: tinypersonal-hub-data
    external: true

networks:
  tinypersonal-network:
    name: tinypersonal-network
    external: true
