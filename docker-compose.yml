services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    networks:
      - tinypersonal-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'until mc alias set local http://minio:9000 "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY"; do sleep 2; done; mc mb --ignore-existing "local/$S3_BUCKET"'
    networks:
      - tinypersonal-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tinypersonal-hub:local
    container_name: tinypersonal-hub
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/dev.db
      MEDIA_LOCAL_ROOT: /data/media
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - tinypersonal-hub-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tinypersonal-network

volumes:
  tinypersonal-hub-data:
    name: tinypersonal-hub-data
    external: true
  minio-data:
    name: minio-data
    external: true

networks:
  tinypersonal-network:
    name: tinypersonal-network
    external: true
